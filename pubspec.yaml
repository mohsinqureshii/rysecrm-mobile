name: ryse_crm
description: "RYSE CRM — an AI-driven sales CRM mobile app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  intl: ^0.20.2
  fl_chart: ^0.69.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  fonts:
    # "Google Sans" is the design-system family name used across the app.
    # Google Sans is a proprietary Google typeface and cannot be redistributed,
    # so these files bundle DM Sans (SIL OFL 1.1) — the closest open, geometric
    # match. To use the licensed Google Sans, replace the four TTFs in
    # assets/fonts/ with the corresponding Google Sans weights (same filenames).
    - family: Google Sans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/DMSans-Bold.ttf
          weight: 700
